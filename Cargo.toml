[package]
name = "corsair-control"
version = "0.1.0"
description = "Native Linux control surface for Corsair input devices"
authors = ["Corsair Control contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.87"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }

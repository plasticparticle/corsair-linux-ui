name: Build Debian release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  debian-package:
    name: Build and attach .deb
    # Build on the oldest supported GitHub Ubuntu image to keep the resulting
    # glibc requirement friendly to Ubuntu 22.04 and Linux Mint users.
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Test release source
        run: cargo test --locked

      - name: Build Debian package
        run: ./scripts/build-deb.sh "${{ github.event.release.tag_name }}"

      - name: Upload package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.deb --clobber
